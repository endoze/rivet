<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title">
  <title id="title">Rivet</title>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4bcc3"/>
      <stop offset=".45" stop-color="#d5dade"/>
      <stop offset=".55" stop-color="#a9b1b8"/>
      <stop offset="1" stop-color="#8d959d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="brushed" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.9" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="dome" cx=".38" cy=".32" r=".7">
      <stop offset="0" stop-color="#9aa1a8"/>
      <stop offset=".25" stop-color="#4a5056"/>
      <stop offset=".7" stop-color="#1e2124"/>
      <stop offset="1" stop-color="#0b0c0d"/>
    </radialGradient>
    <radialGradient id="dome-steel" cx=".38" cy=".32" r=".7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#d9dee2"/>
      <stop offset=".7" stop-color="#7d868e"/>
      <stop offset="1" stop-color="#454c53"/>
    </radialGradient>
    <radialGradient id="drop">
      <stop offset=".55" stop-color="#000" stop-opacity=".5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <g id="rivet">
      <circle cx="3" cy="3.5" r="12" fill="url(#drop)"/>
      <circle r="9.5" fill="#3a4047"/>
      <circle r="8.6" fill="url(#dome)"/>
    </g>
    <g id="rivet-steel">
      <circle cx="3" cy="3.5" r="12" fill="url(#drop)"/>
      <circle r="9.5" fill="#3a4047"/>
      <circle r="8.6" fill="url(#dome-steel)"/>
    </g>
  </defs>

  <rect x="8" y="8" width="864" height="284" rx="18" fill="url(#steel)" stroke="#5d656c" stroke-width="2"/>
  <rect x="8" y="8" width="864" height="284" rx="18" fill="#000" filter="url(#brushed)" opacity=".18"/>
  <rect x="8" y="8" width="864" height="284" rx="18" fill="url(#sheen)"/>
  <rect x="14" y="14" width="852" height="272" rx="13" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.5"/>
  <rect x="37" y="37" width="806" height="226" rx="6" fill="none" stroke="#fff" stroke-opacity=".45"/>
  <rect x="36" y="36" width="806" height="226" rx="6" fill="none" stroke="#5d656c" stroke-opacity=".6"/>

  <use href="#rivet-steel" transform="translate(22 22) scale(.6)"/>
  <use href="#rivet-steel" transform="translate(858 22) scale(.6)"/>
  <use href="#rivet-steel" transform="translate(22 278) scale(.6)"/>
  <use href="#rivet-steel" transform="translate(858 278) scale(.6)"/>

  <g id="letter-r" transform="translate(80 78)">
    <use href="#rivet" x="0" y="0"/><use href="#rivet" x="24" y="0"/><use href="#rivet" x="48" y="0"/><use href="#rivet" x="72" y="0"/>
    <use href="#rivet" x="0" y="24"/><use href="#rivet" x="96" y="24"/>
    <use href="#rivet" x="0" y="48"/><use href="#rivet" x="96" y="48"/>
    <use href="#rivet" x="0" y="72"/><use href="#rivet" x="24" y="72"/><use href="#rivet" x="48" y="72"/><use href="#rivet" x="72" y="72"/>
    <use href="#rivet" x="0" y="96"/><use href="#rivet" x="48" y="96"/>
    <use href="#rivet" x="0" y="120"/><use href="#rivet" x="72" y="120"/>
    <use href="#rivet" x="0" y="144"/><use href="#rivet" x="96" y="144"/>
  </g>

  <g id="letter-i" transform="translate(248 78)">
    <use href="#rivet" x="0" y="0"/><use href="#rivet" x="24" y="0"/><use href="#rivet" x="48" y="0"/>
    <use href="#rivet" x="24" y="24"/>
    <use href="#rivet" x="24" y="48"/>
    <use href="#rivet" x="24" y="72"/>
    <use href="#rivet" x="24" y="96"/>
    <use href="#rivet" x="24" y="120"/>
    <use href="#rivet" x="0" y="144"/><use href="#rivet" x="24" y="144"/><use href="#rivet" x="48" y="144"/>
  </g>

  <g id="letter-v" transform="translate(368 78)">
    <use href="#rivet" x="0" y="0"/><use href="#rivet" x="96" y="0"/>
    <use href="#rivet" x="0" y="24"/><use href="#rivet" x="96" y="24"/>
    <use href="#rivet" x="0" y="48"/><use href="#rivet" x="96" y="48"/>
    <use href="#rivet" x="0" y="72"/><use href="#rivet" x="96" y="72"/>
    <use href="#rivet" x="0" y="96"/><use href="#rivet" x="96" y="96"/>
    <use href="#rivet" x="24" y="120"/><use href="#rivet" x="72" y="120"/>
    <use href="#rivet" x="48" y="144"/>
  </g>

  <g id="letter-e" transform="translate(536 78)">
    <use href="#rivet" x="0" y="0"/><use href="#rivet" x="24" y="0"/><use href="#rivet" x="48" y="0"/><use href="#rivet" x="72" y="0"/><use href="#rivet" x="96" y="0"/>
    <use href="#rivet" x="0" y="24"/>
    <use href="#rivet" x="0" y="48"/>
    <use href="#rivet" x="0" y="72"/><use href="#rivet" x="24" y="72"/><use href="#rivet" x="48" y="72"/><use href="#rivet" x="72" y="72"/>
    <use href="#rivet" x="0" y="96"/>
    <use href="#rivet" x="0" y="120"/>
    <use href="#rivet" x="0" y="144"/><use href="#rivet" x="24" y="144"/><use href="#rivet" x="48" y="144"/><use href="#rivet" x="72" y="144"/><use href="#rivet" x="96" y="144"/>
  </g>

  <g id="letter-t" transform="translate(704 78)">
    <use href="#rivet" x="0" y="0"/><use href="#rivet" x="24" y="0"/><use href="#rivet" x="48" y="0"/><use href="#rivet" x="72" y="0"/><use href="#rivet" x="96" y="0"/>
    <use href="#rivet" x="48" y="24"/>
    <use href="#rivet" x="48" y="48"/>
    <use href="#rivet" x="48" y="72"/>
    <use href="#rivet" x="48" y="96"/>
    <use href="#rivet" x="48" y="120"/>
    <use href="#rivet" x="48" y="144"/>
  </g>
</svg>
