# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
enable_free_tier: true

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  path_filters:
    - "!Cargo.lock"
    - "!target/**"
    - "!coverage/**"
    - "!CHANGELOG.md"
    - "!vendor/**"
  path_instructions:
    - path: "crates/*/src/**/*.rs"
      instructions: |
        Public items need rustdoc covering the contract: purpose, invariants,
        errors, panics, and an example where it helps. Inline `//` comments are
        only warranted for a why the code cannot state (a workaround and its
        reason, a drop-order dependency, a deliberate fail-closed choice).
        Flag inline comments that restate what the code does or describe a
        dependency's internals.

        Rivet is a gpui desktop mod manager on top of `thunderstore-engine`,
        which owns downloads, extraction, profile layout, and dependency
        resolution. Flag Rivet code that duplicates or bypasses the engine.
        `rivet-core` is pure state and decisions: no UI toolkit, async runtime,
        HTTP client, or zip (CI refuses them). `rivet-commands` runs the IO
        that core asks for, `rivet-platform` holds OS integration, and
        `rivet-app` is the gpui UI, with user-facing text in `text.rs`. Use the
        terms in GLOSSARY.md and avoid the ones it lists under _Avoid_. Keep
        `#[cfg(unix)]`/`#[cfg(windows)]` gates intact: releases ship Linux and
        Windows. Tests never reach the network; they use the engine's mock
        Thunderstore. rustfmt uses `tab_spaces = 2`.

        Do not comment on style that `cargo fmt` or
        `cargo clippy --workspace --all-targets -- -D warnings` already
        enforces.
    - path: "crates/*/tests/**/*.rs"
      instructions: |
        Check that tests assert behavior rather than restating the
        implementation, and that new public API or bugfixes come with
        coverage.
    - path: ".github/workflows/**"
      instructions: |
        Every third-party action must be pinned to a full commit SHA with the
        version in a trailing comment (`uses: owner/action@<sha> # vX.Y.Z`).
        release.yml is generated by dist: change dist-workspace.toml (action
        SHAs and version comments live in `[dist.github-action-commits]`) and
        regenerate. dist alone creates GitHub Releases (release-plz.toml keeps
        `git_release_enable = false`).
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Stacked PRs target the branch below them, not just master.
    base_branches:
      - ".*"
  tools:
    clippy:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true

chat:
  art: false
  auto_reply: true
  allow_non_org_members: false

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
