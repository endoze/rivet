[package]
name = "rivet-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rivet-commands.workspace = true
futures.workspace = true
gpui-kit.workspace = true
reqwest_client.workspace = true
rivet-platform.workspace = true
rivet-core.workspace = true
thunderstore-engine.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
thunderstore-engine = { workspace = true, features = ["rustls-tls", "test-support"] }

# A text system that can start with no fonts at all, which gpui builds only on
# Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu.workspace = true

[[bin]]
name = "rivet"
path = "src/main.rs"
