name: Tests

# One run per pull request (pull_request event) and one per merge to master
# (push event). Feature-branch pushes do not trigger a second run.
on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Check formatting
        run: nix develop -c cargo fmt --all --check
      - name: Lint
        run: nix develop -c cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test the workspace
        run: nix develop -c cargo test --workspace --locked
      - name: Test the pure crate on its own
        run: nix develop -c cargo test -p rivet-core --locked
      - name: Refuse a UI toolkit, async runtime or HTTP client in the pure crate
        run: |
          tree="$(nix develop -c cargo tree -p rivet-core -e normal --prefix none)"
          status=0
          for crate in gpui-kit gpui-pre tokio reqwest hyper async-std smol zip; do
            if grep -q "^${crate} v" <<< "$tree"; then
              echo "::error::${crate} is in the dependency tree of the rivet-core crate"
              status=1
            fi
          done
          exit "$status"

  # Only the pure crate: the others need gpui's system libraries to build.
  coverage:
    name: Coverage of the pure crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-tarpaulin
      - name: Generate code coverage
        run: cargo tarpaulin --engine llvm -p rivet-core --locked
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ github.token }}

  windows:
    name: Build and test on Windows
    runs-on: windows-latest
    env:
      # The runner image does not promise NASM, so use aws-lc-sys's prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Build the workspace
        run: cargo build --workspace --locked
      - name: Test the workspace
        run: cargo test --workspace --locked
