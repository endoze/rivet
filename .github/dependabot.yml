version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Also update indirect dependencies: release-plz no longer runs cargo update.
    allow:
      - dependency-type: all
    # These follow gpui (see the pins in Cargo.toml), so they move by hand
    # with gpui-kit. A lone bump builds a second copy or a mismatched UI.
    ignore:
      - dependency-name: "gpui-kit"
      - dependency-name: "gpui-pre-*"
      - dependency-name: "windows"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "windows-registry"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "windows-sys"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    # dist generates release.yml from dist-workspace.toml; bump its action
    # pins there and regenerate, or the next regeneration reverts them.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
