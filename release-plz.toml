[workspace]
changelog_update = true
# Dependabot (with a cooldown) owns dependency updates; release PRs only release.
dependencies_update = false
git_tag_enable = true
# dist's release.yml owns the GitHub Release; release-plz only tags.
git_release_enable = false
pr_labels = ["release"]
allow_dirty = false
publish_allow_dirty = false
semver_check = false
features_always_increment_minor = true

# Nothing goes to crates.io, so the last release is found from git tags.
git_only = true
publish = false

# Release only when a release PR is merged, never on an ordinary push.
release_always = false

[changelog]
# release-plz's default parsers, plus skips for Dependabot's grouped bumps.
commit_parsers = [
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^ci\\(deps\\)", skip = true },
  { message = "^feat", group = "added" },
  { message = "^changed", group = "changed" },
  { message = "^deprecated", group = "deprecated" },
  { message = "^fix", group = "fixed" },
  { message = "^security", group = "security" },
  { message = "^.*", group = "other" },
]

# The crates share the workspace version, and a change to any of them can
# raise it past a patch. Only the app is tagged and keeps a changelog.
[[package]]
name = "rivet-app"
version_group = "rivet"
git_tag_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"
changelog_include = ["rivet-core", "rivet-commands", "rivet-platform"]

[[package]]
name = "rivet-core"
version_group = "rivet"
git_tag_name = "v{{ version }}"
git_tag_enable = false
changelog_update = false

[[package]]
name = "rivet-commands"
version_group = "rivet"
git_tag_name = "v{{ version }}"
git_tag_enable = false
changelog_update = false

[[package]]
name = "rivet-platform"
version_group = "rivet"
git_tag_name = "v{{ version }}"
git_tag_enable = false
changelog_update = false
