[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
state = { path = "crates/state" }
commands = { path = "crates/commands" }
platform = { path = "crates/platform" }
app = { path = "crates/app" }
futures = "0.3"
gpui-kit = "=0.9.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
