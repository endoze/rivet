[workspace]
resolver = "3"
members = ["crates/*"]
exclude = [".worktrees", "vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
rivet-core = { path = "crates/rivet-core" }
rivet-commands = { path = "crates/rivet-commands" }
rivet-platform = { path = "crates/rivet-platform" }
rivet-app = { path = "crates/rivet-app" }
dirs = "6"
futures = "0.3"
gpui-kit = "=0.9.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The image client must match the gpui-pre snapshot gpui-kit bundles.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.12" }
# The same holds for the text system the font test loads into.
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thunderstore-engine = { version = "0.4.2", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync"] }
toml = "1"
zip = "8.6"

# Full debug info for gpui makes each test binary near 1 GB. Line tables
# keep file:line backtraces for Rivet's own code at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# gpui's Windows crate precompiles its shaders only when built on Windows. This
# copy also precompiles them when cross-compiling from Linux. It must match the
# version gpui-kit pins.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
